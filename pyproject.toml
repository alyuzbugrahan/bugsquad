[project]
name = "bugsquad"
version = "0.1.0"
description = "A multi-agent system that finds and fixes bugs in Python projects, verified by running tests."
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
bugsquad = "bugsquad.cli:main"
